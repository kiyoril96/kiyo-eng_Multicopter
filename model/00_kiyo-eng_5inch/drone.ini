[model]
file=quad.kn5       ; モデルファイル名
colider=colider     ; コライダーメッシュのノード名
camera=maincamera   ; カメラ本体のノード名（カメラ回転の中心に適用）
viewPoint=eye       ; カメラレンズのノード名（FPVのカメラ位置に適用）
propeller=rotor     ; プロペラとして回転させるノード名 4つあるはずなのでプレフィックスだけ設定
                    ; xxFL xxFR xxRL xxRR の4ノードが必要

[drone]     ; 物理関連
foce= 2600  ; ドローンの推力 単位不明...    設定値をフレームレートで割り算して適用
mass=0.700  ; 本体重量 kg バッテリーとか含めた重量で
damping=1   ; 物理演算の角度抗力に乗算変更不要なら1を適用 極端な値は操作しずらくなる 

; モーターの位置 ローカル座標（横,高さ,奥行方向）力を加える基準位置
motorFLPos=  0.074 ,0.006 , 0.072  ; 左前
motorFRPos= -0.074 ,0.006 , 0.072  ; 右前
motorRLPos=  0.074 ,0.006 ,-0.072  ; 左後
motorRRPos= -0.074 ,0.006 ,-0.072  ; 右後

propellerOffset= 0.0043     ; プロペラの高さオフセット 実際に力を加える位置に適用

[control]
; 機体の各軸回転速度に乗算
; グローバル設定もあるので変更不要な場合は1を設定
pitchMix=1  ; X軸 上下に回転する速度
rollMix=1   ; Z軸 左右に回転する速度
yawMix=1    ; Y軸 左右に水平回転する速度

[sfx]
sfx=kiyo-eng_qc.bank    ;SFXのファイル名 とりあえずpowのパラメーターだけ使ってる...
powerEvent=event:/kiyo-eng_qc/power